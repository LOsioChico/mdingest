<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1a1a2e" />
  <rect x="0" y="0" width="1200" height="630" fill="oklch(15% 0.02 260)" />

  <!-- Logo -->
  <rect x="80" y="80" width="48" height="48" rx="8" fill="oklch(63% 0.20 250)" />
  <text x="104" y="113" font-family="monospace" font-size="28" font-weight="700" fill="oklch(98% 0.01 260)" text-anchor="middle">m</text>

  <!-- Wordmark -->
  <text x="144" y="113" font-family="monospace" font-size="24" font-weight="600" fill="oklch(95% 0.01 260)">mdingest</text>

  <!-- Headline -->
  <text x="80" y="240" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="oklch(95% 0.01 260)" letter-spacing="-2">
