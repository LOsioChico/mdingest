  </text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="24" fill="oklch(65% 0.02 260)">
    Medium / Dev.to / Substack → clean Markdown with YAML frontmatter
  </text>

  <!-- Terminal mockup -->
  <rect x="80" y="430" width="700" height="140" rx="8" fill="oklch(19% 0.02 260)" stroke="oklch(28% 0.02 260)" stroke-width="1" />
  <text x="100" y="470" font-family="monospace" font-size="16" fill="oklch(63% 0.20 250)">$</text>
