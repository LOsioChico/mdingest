name = "mdingest"
main = "src/worker.ts"
compatibility_date = "2026-10-15"

# Cloudflare Workers — no containers, no frameworks. The Worker routes
# /v1/* to the API and serves the static Astro site via the ASSETS binding.

[observability]
enabled = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
run_worker_first = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1"
  [ratelimits.simple]
  limit = 30
  period = 60


