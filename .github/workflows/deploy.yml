name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run verify
      - run: bun run test
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployment
        run: |
          sleep 20
          curl -s -o /dev/null -w "HTTP %{http_code}" "https://mdingest.knightker.workers.dev/"
          echo " /"
          curl -s -o /dev/null -w "HTTP %{http_code}" "https://mdingest.knightker.workers.dev/ingest"
          echo " /ingest"
          curl -s -o /dev/null -w "HTTP %{http_code}" "https://mdingest.knightker.workers.dev/docs"
          echo " /docs"
